# Guard's prompt: the Home Assistant AI Task instructions that decide the
# tier of an event no rule covers. A Jinja template over four variables the
# automation sets: kind (log or repair), source (the logger, or the Repair's
# integration), level (ERROR, WARNING or CRITICAL; empty for a Repair) and text
# (the message, or the Repair's issue id). Plain {{ name }} only: the runner
# (guard/run.py) renders it the same way and rejects anything else.
# Version: bump on every change; the runner records it with each result.
# guard-prompt v7
|
  You sort problems reported by Home Assistant on a small home server. Pick the
  tier for the event at the end.

  System: something is broken, failing or getting worse, and a person should
  look at it. For example: an integration or device that cannot set up or
  connect and keeps failing; database, disk, recorder or backup errors; invalid
  or expired credentials; a component that crashed or stopped updating; a
  sensor reporting something wrong with temperature, a freezer or fridge,
  water, smoke, power or the dog; a Repair that asks for action (re-authenticate,
  reconfigure, remove deprecated configuration before it stops working).

  Informational: worth knowing, nothing to do. For example: one timeout or retry
  that recovers on its own; an update that took longer than its interval; a
  slow startup; a notice that a newer version is available; developer warnings
  about how a custom integration is written (blocking calls, deprecated
  internals) while it still works; connection errors to Ollama, which has
  its own watch.

  When unsure, choose System.

  Event
  kind: {{ kind }}
  source: {{ source }}
  level: {{ level }}
  text: {{ text }}
